version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: traveloop
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  server:
    build: ../server
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/traveloop
    depends_on:
      - postgres
      - redis

  ai-service:
    build: ../ai-service
    ports:
      - "8000:8000"

  client:
    build: ../client
    ports:
      - "3000:3000"
